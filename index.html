<style>
/* Layout: a winding trail of lesson stones on a calm sky; chunky, tactile controls; every unit wears its own hue. */
:root {
  --bg: #F3F5FB;
  --surface: #FFFFFF;
  --surface-2: #EBEFF8;
  --ink: #1B1E3C;
  --ink-2: #565C80;
  --ink-3: #8A90B2;
  --line: #DDE2EF;
  --line-2: #C8CFE2;
  --spark: #FFB31F;
  --spark-deep: #D98A00;
  --spark-soft: #FFF1D2;
  --on-spark: #3A2400;
  --good: #16B67F;
  --good-deep: #0D8C61;
  --good-soft: #DDF6EC;
  --good-ink: #0A6B4A;
  --bad: #EF4E6C;
  --bad-deep: #C5304E;
  --bad-soft: #FDE5EA;
  --bad-ink: #A3233F;
  --flame: #FF7A1A;
  --gem: #1FA5E6;
  --focus: #1FA5E6;
  --scrim: rgba(12, 14, 34, .48);
  --shadow: 0 1px 2px rgba(27, 30, 60, .06), 0 10px 28px rgba(27, 30, 60, .07);

  --amber: #F5A524; --amber-d: #C47F0B;
  --coral: #FF7A59; --coral-d: #D2552F;
  --violet: #8B5CF6; --violet-d: #6638D6;
  --teal: #14B8A6; --teal-d: #0E8C7E;
  --rose: #F43F5E; --rose-d: #C21F3D;
  --sky: #2F9BFF; --sky-d: #1A74D1;
  --lime: #74C11A; --lime-d: #55940E;
  --indigo: #5B6CFF; --indigo-d: #3B49D4;

  --f-display: "Fredoka", "Assistant", system-ui, sans-serif;
  --f-body: "Assistant", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1124; --surface: #171B35; --surface-2: #20254A; --ink: #EDEFFF; --ink-2: #A9AFD3; --ink-3: #757CA6;
    --line: #2A3061; --line-2: #383F78; --spark: #FFBE3D; --spark-deep: #C98A0E; --spark-soft: #3A2E12; --on-spark: #2B1B00;
    --good: #2BD199; --good-deep: #169C70; --good-soft: #10362F; --good-ink: #86F2CD;
    --bad: #FF6684; --bad-deep: #D23F5E; --bad-soft: #3D1828; --bad-ink: #FFA8BA;
    --flame: #FF8A33; --gem: #45B9F2; --focus: #45B9F2; --scrim: rgba(3, 4, 14, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1124; --surface: #171B35; --surface-2: #20254A; --ink: #EDEFFF; --ink-2: #A9AFD3; --ink-3: #757CA6;
  --line: #2A3061; --line-2: #383F78; --spark: #FFBE3D; --spark-deep: #C98A0E; --spark-soft: #3A2E12; --on-spark: #2B1B00;
  --good: #2BD199; --good-deep: #169C70; --good-soft: #10362F; --good-ink: #86F2CD;
  --bad: #FF6684; --bad-deep: #D23F5E; --bad-soft: #3D1828; --bad-ink: #FFA8BA;
  --flame: #FF8A33; --gem: #45B9F2; --focus: #45B9F2; --scrim: rgba(3, 4, 14, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding-inline-start: 1.3em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { flex: none; display: block; }

/* ---------- rich text ---------- */
.rich { display: grid; gap: .65em; min-width: 0; }
.rich ul, .rich ol { display: grid; gap: .3em; }
.rich strong { font-weight: 700; }
.rich a, .note a { color: var(--gem); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
code.c {
  font-family: var(--f-mono); font-size: .84em; font-weight: 500;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: .04em .38em; unicode-bidi: isolate; overflow-wrap: anywhere;
}
.prompt {
  position: relative; background: var(--surface); border: 2px solid var(--line);
  border-radius: 16px; padding: 14px 16px; font-size: .98rem; line-height: 1.65;
  display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere;
}
.prompt .pl { min-height: 1.65em; }
.prompt .pl.blank { min-height: .7em; }
.prompt-label {
  justify-self: start; margin-bottom: 6px; font-family: var(--f-display); font-size: .78rem; font-weight: 600;
  letter-spacing: .03em; color: var(--ink-2); background: var(--surface-2); border-radius: 99px; padding: 2px 10px;
}

/* ---------- buttons ---------- */
.btn {
  --b: var(--surface); --bd: var(--line-2); --bt: var(--ink);
  appearance: none; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: 14px; background: var(--b); color: var(--bt);
  font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; letter-spacing: .01em;
  box-shadow: 0 4px 0 var(--bd); transition: transform .08s, box-shadow .08s, filter .15s; user-select: none;
  text-decoration: none;
}
.btn:hover:not(:disabled) { filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { --b: var(--surface-2); --bd: var(--line); --bt: var(--ink-3); cursor: not-allowed; }
.btn-primary { --b: var(--spark); --bd: var(--spark-deep); --bt: var(--on-spark); }
.btn-good { --b: var(--good); --bd: var(--good-deep); --bt: #fff; }
.btn-bad { --b: var(--bad); --bd: var(--bad-deep); --bt: #fff; }
.btn-ghost { --b: var(--surface); --bd: var(--line-2); border: 2px solid var(--line-2); box-shadow: 0 3px 0 var(--line-2); }
.btn-ghost:active:not(:disabled) { transform: translateY(3px); }
.btn-text { background: none; box-shadow: none; color: var(--ink-2); min-height: 40px; padding: 0 10px; }
.btn-text:active:not(:disabled) { transform: none; }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 14px; font-size: .95rem; border-radius: 12px; box-shadow: 0 3px 0 var(--bd); }
.btn-sm:active:not(:disabled) { transform: translateY(3px); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; color: var(--ink-3);
  display: grid; place-items: center;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- boot ---------- */
.boot { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--ink-2); }
.boot-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--spark); animation: bob 1s ease-in-out infinite; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
.sidenav, .rail { display: none; }
.main { min-width: 0; overflow-x: clip; padding-bottom: calc(86px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 420px) { .hide-xs { display: none; } }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; color: var(--ink); }
.brand .mascot { width: 30px; }
.chips { display: flex; align-items: center; gap: 4px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 9px; border-radius: 12px; border: 0; background: none;
  font-family: var(--f-display); font-weight: 600; font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--ink-2);
}
.chip:hover { background: var(--surface-2); }
.chip.flame { color: var(--flame); }
.chip.flame.cold { color: var(--ink-3); }
.chip.gem { color: var(--gem); }
.chip.lvl { color: var(--ink); }
.lvl-badge {
  display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 8px;
  background: var(--ink); color: var(--bg); font-size: .85rem;
}
.view { width: 100%; max-width: 660px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 22px; }
.tabbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around;
  background: var(--surface); border-top: 2px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tab {
  flex: 1; max-width: 96px; border: 0; background: none; display: grid; justify-items: center; gap: 2px;
  padding: 6px 2px; border-radius: 12px; color: var(--ink-3); font-size: .74rem; font-weight: 700;
}
.tab.on { color: var(--ink); }
.tab.on .ic { color: var(--spark-deep); }
.tab .ic { width: 26px; height: 26px; }
.navlink {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 11px 14px; border-radius: 14px;
  border: 2px solid transparent; background: none; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem;
  color: var(--ink-2); text-align: start;
}
.navlink:hover { background: var(--surface-2); }
.navlink.on { background: var(--spark-soft); border-color: color-mix(in srgb, var(--spark) 55%, transparent); color: var(--ink); }
.navlink.on .ic { color: var(--spark-deep); }

@media (min-width: 900px) {
  .shell { grid-template-columns: 236px minmax(0, 1fr); }
  .sidenav {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
    padding: 22px 14px; border-inline-end: 2px solid var(--line);
  }
  .sidenav .brand { padding: 4px 10px 18px; font-size: 1.7rem; }
  .sidenav .brand .mascot { width: 38px; }
  .tabbar { display: none; }
  .main { padding-bottom: 0; }
}
@media (min-width: 1240px) {
  .shell { grid-template-columns: 236px minmax(0, 1fr) 350px; }
  .rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 22px 22px 26px; }
  .topbar { display: none; }
  .only-narrow { display: none !important; }
}

/* ---------- cards & common ---------- */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-h h3 { font-size: 1.15rem; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.eyebrow { font-family: var(--f-display); font-size: .8rem; font-weight: 600; letter-spacing: .05em; color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.page-h { display: grid; gap: 4px; }
.page-h h1 { font-size: 1.75rem; }
.stack { display: grid; gap: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px;
  background: var(--surface-2); color: var(--ink-2); font-size: .8rem; font-weight: 700;
}
.pill.ai { background: color-mix(in srgb, var(--gem) 14%, var(--surface)); color: var(--gem); }
.pill.good { background: var(--good-soft); color: var(--good-ink); }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; background: var(--surface); }
.stat .v { font-family: var(--f-display); font-weight: 600; font-size: 1.45rem; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.stat .k { font-size: .82rem; color: var(--ink-2); font-weight: 600; }

/* ---------- today card ---------- */
.today-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; }
.ring { position: relative; width: 84px; height: 84px; }
.ring svg { transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--f-display); font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.ring .rv b { font-size: 1.3rem; }
.ring .rv span { font-size: .72rem; color: var(--ink-3); }
.today-card h2 { font-size: 1.3rem; }
.today-card .cta { grid-column: 1 / -1; }
.today-msg { color: var(--ink-2); font-size: .95rem; }
.today-msg.risk { color: var(--flame); font-weight: 700; }

/* ---------- quests ---------- */
.quest { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.quest-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--spark-soft); color: var(--spark-deep); }
.quest.done .quest-ic { background: var(--good-soft); color: var(--good); }
.quest-t { font-weight: 700; font-size: .95rem; display: flex; justify-content: space-between; gap: 8px; }
.qbar { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 5px; }
.qbar i { display: block; height: 100%; border-radius: inherit; background: var(--spark); transition: width .4s; }
.quest.done .qbar i { background: var(--good); }

/* ---------- path ---------- */
.unit { --u: var(--amber); --u-d: var(--amber-d); display: grid; gap: 4px; }
.u-amber { --u: var(--amber); --u-d: var(--amber-d); }
.u-coral { --u: var(--coral); --u-d: var(--coral-d); }
.u-violet { --u: var(--violet); --u-d: var(--violet-d); }
.u-teal { --u: var(--teal); --u-d: var(--teal-d); }
.u-rose { --u: var(--rose); --u-d: var(--rose-d); }
.u-sky { --u: var(--sky); --u-d: var(--sky-d); }
.u-lime { --u: var(--lime); --u-d: var(--lime-d); }
.u-indigo { --u: var(--indigo); --u-d: var(--indigo-d); }
[class*="u-"] { --u-soft: color-mix(in srgb, var(--u) 14%, var(--surface)); --u-ink: color-mix(in srgb, var(--u) 52%, var(--ink)); }
.unit-head {
  display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 20px;
  background: var(--u-soft); border: 2px solid color-mix(in srgb, var(--u) 35%, transparent);
}
.unit-head .uic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--u); color: #fff; box-shadow: 0 4px 0 var(--u-d); flex: none; }
.unit-head .eyebrow { color: var(--u-ink); }
.unit-head h2 { font-size: 1.3rem; }
.unit-head p { color: var(--ink-2); font-size: .92rem; }
.unit.locked .unit-head { background: var(--surface-2); border-color: var(--line); }
.unit.locked .unit-head .uic { background: var(--line-2); box-shadow: 0 4px 0 var(--line); }
.unit.locked .unit-head .eyebrow { color: var(--ink-3); }
.unit-progress { font-size: .82rem; font-weight: 700; color: var(--u-ink); }

.trail { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 52px 0 20px; }
.nw.current { margin-top: 22px; }
.nw { position: relative; transform: translateX(var(--x, 0px)); display: grid; justify-items: center; }
.node {
  position: relative; width: 78px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--u); color: #fff; box-shadow: 0 7px 0 var(--u-d); transition: transform .08s, box-shadow .08s;
}
.node::after { content: ""; position: absolute; inset: 8px 14px auto; height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .25); }
.node:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--u-d); }
.node.locked { background: var(--surface-2); color: var(--ink-3); box-shadow: 0 7px 0 var(--line-2); }
.node.locked::after { display: none; }
.node.big { width: 92px; height: 84px; }
.nw.current::before {
  content: ""; position: absolute; top: -10px; left: 50%; width: 100px; height: 94px; margin-left: -50px; border-radius: 50%;
  border: 6px solid color-mix(in srgb, var(--u) 30%, transparent); animation: pulse 1.9s ease-in-out infinite; pointer-events: none;
}
.nw.current .node.big + .stars, .nw .stars { display: flex; gap: 2px; margin-top: 10px; color: var(--line-2); }
.stars .on { color: var(--spark); }
.bubble {
  position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: var(--surface); color: var(--u-ink); border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px;
  font-family: var(--f-display); font-weight: 700; font-size: .95rem; letter-spacing: .02em; animation: float 1.6s ease-in-out infinite;
  pointer-events: none; box-shadow: var(--shadow);
}
.bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--surface); }
.nw.open { z-index: 25; }
.pop {
  position: absolute; top: calc(100% + 12px); left: 50%; transform: translateX(calc(-50% - var(--x, 0px))); z-index: 15; width: min(290px, 82vw);
  background: var(--u); color: #fff; border-radius: 18px; padding: 16px; display: grid; gap: 10px; box-shadow: 0 6px 0 var(--u-d), var(--shadow);
  animation: popin .18s ease-out; text-align: start;
}
.pop.locked { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
.pop h4 { font-size: 1.15rem; }
.pop p { font-size: .92rem; opacity: .92; }
.pop .btn { --b: #fff; --bd: color-mix(in srgb, var(--u-d) 60%, #000); --bt: var(--u-d); }
.pop::before { content: ""; position: absolute; bottom: 100%; left: calc(50% + var(--x, 0px)); margin-left: -9px; border: 9px solid transparent; border-bottom-color: var(--u); }
.pop.locked::before { border-bottom-color: var(--line); }
.trail-mascot { position: absolute; top: 46%; pointer-events: none; }
.trail-mascot .mascot { width: 92px; }
.unit-jump { justify-self: center; }

/* ---------- mascot ---------- */
.mascot { display: inline-block; line-height: 0; }
.mascot svg { width: 100%; height: auto; overflow: visible; }
.mascot.bob svg { animation: bob 2.4s ease-in-out infinite; }
.mascot.jump svg { animation: jump .9s cubic-bezier(.3, .7, .4, 1.4) 2; }
.mascot.wiggle svg { animation: wiggle .6s ease-in-out 2; }

/* ---------- session (lesson) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); animation: fade .2s ease-out;
}
.s-top { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 760px; margin: 0 auto; padding: 14px 16px 8px; }
.pbar { flex: 1; height: 16px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pbar i {
  display: block; height: 100%; width: 0; border-radius: inherit; background: var(--good);
  transition: width .45s cubic-bezier(.3, .8, .4, 1.15); position: relative;
}
.pbar i::after { content: ""; position: absolute; inset: 3px 8px auto; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .35); }
.combo { min-width: 54px; display: flex; align-items: center; gap: 3px; font-family: var(--f-display); font-weight: 700; color: var(--flame); font-variant-numeric: tabular-nums; }
.combo.hide { visibility: hidden; }
.combo.bump { animation: bump .35s; }
.s-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.s-inner { max-width: 660px; margin: 0 auto; padding: 14px 16px 28px; display: grid; gap: 18px; }
.s-foot { border-top: 2px solid var(--line); background: var(--bg); transition: background .2s; }
.s-foot.good { background: var(--good-soft); border-top-color: transparent; }
.s-foot.bad { background: var(--bad-soft); border-top-color: transparent; }
.s-foot.info { background: var(--spark-soft); border-top-color: transparent; }
.s-foot-in { max-width: 660px; margin: 0 auto; padding: 14px 16px 16px; display: grid; gap: 12px; }
.s-actions { display: flex; gap: 10px; align-items: center; }
.s-actions .btn-main { flex: 1; }
@media (min-width: 700px) { .s-actions .btn-main { flex: 0 0 220px; margin-inline-start: auto; } }
.fb { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; animation: up .22s ease-out; }
.fb-ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); }
.s-foot.good .fb-ic { color: var(--good); }
.s-foot.bad .fb-ic { color: var(--bad); }
.s-foot.info .fb-ic { color: var(--spark-deep); }
.fb-t { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; }
.s-foot.good .fb-t { color: var(--good-ink); }
.s-foot.bad .fb-t { color: var(--bad-ink); }
.fb-body { display: grid; gap: 8px; max-height: 34vh; overflow-y: auto; font-size: .97rem; }
.fb-ans { font-weight: 700; }
.fb-ai { border-radius: 14px; background: var(--surface); padding: 12px 14px; font-size: .95rem; }
.ai-link { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; color: var(--gem); font-weight: 700; font-size: .92rem; }
.ai-link:hover { text-decoration: underline; }
.hint-line { color: var(--ink-2); font-size: .92rem; font-weight: 600; }

/* ---------- exercises ---------- */
.ex { display: grid; gap: 18px; animation: slidein .28s ease-out; }
.ex-kind { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: .9rem; font-weight: 600; color: var(--ink-2); }
.ex-kind .ic { color: var(--spark-deep); }
.ex-q { font-size: 1.24rem; font-weight: 700; line-height: 1.45; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 13px 14px; min-height: 58px;
  border-radius: 16px; border: 2px solid var(--line-2); background: var(--surface); box-shadow: 0 4px 0 var(--line-2);
  font-size: 1.02rem; line-height: 1.42; transition: transform .06s, box-shadow .06s, background .15s, border-color .15s;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-2); }
.opt:disabled { cursor: default; }
.opt.sel { border-color: var(--gem); background: color-mix(in srgb, var(--gem) 10%, var(--surface)); box-shadow: 0 4px 0 color-mix(in srgb, var(--gem) 60%, var(--line-2)); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .35s; }
.opt.missed { border-color: var(--good); border-style: dashed; }
.opt-k {
  flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line-2); display: grid; place-items: center;
  font-family: var(--f-mono); font-size: .78rem; color: var(--ink-3);
}
.opt.sel .opt-k { border-color: var(--gem); color: var(--gem); }
.opt-box { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; }
.opt.sel .opt-box { background: var(--gem); border-color: var(--gem); color: #fff; }
.opt-t { min-width: 0; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .opt { justify-content: center; min-height: 72px; font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
.statement { font-size: 1.15rem; font-weight: 600; line-height: 1.5; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px; }

/* learn card */
.learn { background: var(--surface); border-radius: 24px; padding: 22px 20px; box-shadow: var(--shadow); display: grid; gap: 14px; border: 2px solid var(--line); }
.learn-h { display: flex; align-items: center; gap: 12px; }
.learn-h .mascot { width: 52px; flex: none; }
.learn-h h2 { font-size: 1.45rem; }
.learn .rich { font-size: 1.06rem; line-height: 1.65; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--spark-soft); border-radius: 14px; padding: 12px 14px; font-size: .95rem; }
.note .ic { color: var(--spark-deep); margin-top: 2px; }

/* order */
.slots { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface-2); border: 2px dashed var(--line-2); min-height: 80px; }
.slot-empty { height: 50px; border-radius: 12px; border: 2px dashed var(--line-2); display: flex; align-items: center; padding: 0 12px; color: var(--ink-3); font-family: var(--f-mono); font-size: .8rem; }
.bank { display: grid; gap: 8px; }
.card-chip {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; padding: 11px 13px; min-height: 50px;
  border-radius: 13px; border: 2px solid var(--line-2); background: var(--surface); box-shadow: 0 3px 0 var(--line-2); font-size: .98rem; line-height: 1.4;
  animation: popin .16s ease-out;
}
.card-chip:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line-2); }
.card-chip.ghost { visibility: hidden; animation: none; }
.card-chip .num { flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: .76rem; color: var(--ink-2); }
.card-chip.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
.card-chip.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.correct-order { display: grid; gap: 4px; font-size: .92rem; }

/* match */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
.match-col { display: grid; gap: 10px; }
.mt {
  width: 100%; min-height: 58px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--surface);
  box-shadow: 0 4px 0 var(--line-2); font-size: .95rem; line-height: 1.35; text-align: center; transition: background .15s, border-color .15s, opacity .3s;
}
.mt.term { font-weight: 700; }
.mt.sel { border-color: var(--gem); background: color-mix(in srgb, var(--gem) 10%, var(--surface)); box-shadow: 0 4px 0 color-mix(in srgb, var(--gem) 60%, var(--line-2)); }
.mt.ok { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.mt.no { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .35s; }
.mt.done { opacity: .38; box-shadow: none; border-color: var(--line); cursor: default; }

/* cloze */
.cloze-text { font-size: 1.15rem; line-height: 2.3; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 18px; }
.blank {
  display: inline-flex; align-items: center; justify-content: center; min-width: 84px; min-height: 40px; vertical-align: middle; margin: 0 3px;
  padding: 2px 12px; border: 0; border-bottom: 3px solid var(--line-2); border-radius: 10px 10px 4px 4px; background: var(--surface-2);
  font-weight: 700; font-size: 1rem; line-height: 1.3;
}
.blank.filled { background: color-mix(in srgb, var(--gem) 12%, var(--surface)); border-bottom-color: var(--gem); }
.blank.right { background: var(--good-soft); border-bottom-color: var(--good); }
.blank.wrong { background: var(--bad-soft); border-bottom-color: var(--bad); }
.blank .fix { display: block; font-size: .74rem; color: var(--good-ink); font-weight: 700; }
.word-bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.word {
  padding: 9px 16px; border-radius: 13px; border: 2px solid var(--line-2); background: var(--surface); box-shadow: 0 3px 0 var(--line-2);
  font-weight: 700; font-size: 1rem;
}
.word:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line-2); }
.word.used { visibility: hidden; }

/* compare */
.compare { display: grid; gap: 12px; }
@media (min-width: 760px) { .compare.side { grid-template-columns: 1fr 1fr; } }
.cmp { display: grid; gap: 0; text-align: start; border: 2px solid var(--line-2); border-radius: 18px; background: var(--surface); box-shadow: 0 4px 0 var(--line-2); padding: 0; overflow: hidden; }
.cmp .cmp-h { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 2px solid var(--line); font-family: var(--f-display); font-weight: 600; color: var(--ink-2); }
.cmp .cmp-h b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.cmp .prompt { border: 0; border-radius: 0; background: none; }
.cmp.sel { border-color: var(--gem); box-shadow: 0 4px 0 color-mix(in srgb, var(--gem) 60%, var(--line-2)); }
.cmp.sel .cmp-h b { background: var(--gem); color: #fff; }
.cmp.right { border-color: var(--good); box-shadow: 0 4px 0 var(--good); }

@keyframes dot { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

@keyframes toastout { to { transform: translateY(-12px); opacity: 0; } }

}

  // ---------- dates (local days) ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  N.dayKey = function (d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  N.today = function () { return N.dayKey(new Date()); };
  N.dayNum = function (key) {
    if (!key) return null;

    return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5);
  };
  N.keyFromNum = function (n) {
    const d = new Date(n * 864e5);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  };
  N.DAYS_HE = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
  N.weekday = function (key) { const n = N.dayNum(key); return (n + 4) % 7; }; // 1970-01-01 was a Thursday (4)

  // ---------- state ----------
  function defaults() {
    return {
      v: 1,
      createdAt: Date.now(),
      updatedAt: 0,
      profile: { onboarded: false, goal: 40, sound: true, exp: 'some' },
      xp: 0,
      gems: 25,
      streak: { count: 0, best: 0, last: null, freezes: 0, frozen: [] },
      days: {},
      lessons: {},
      units: {},
      items: {},
      quests: { day: null, list: [], bonus: false },
      missions: {},
      badges: {},
      writes: [],

      skin: 'spark',
      owned: ['spark'],
      chat: [],
      daily: null

  }
  function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }
  function merge(base, src) {
    if (!isObj(src)) return base;
    Object.keys(src).forEach(function (k) {
      if (isObj(base[k]) && isObj(src[k])) base[k] = merge(base[k], src[k]);
      else base[k] = src[k];

    return base;
  }
  N.migrate = function (s) { return merge(defaults(), JSON.parse(JSON.stringify(s || {}))); };
  N.fresh = defaults;

  const LS_KEY = 'nitzutz.v1';
  function loadLocal() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(N.state)); } catch (e) { /* storage unavailable */ }
  }
  N.state = N.migrate(loadLocal());

  function prune() {
    const s = N.state;
    const keys = Object.keys(s.days).sort();
    if (keys.length > 420) keys.slice(0, keys.length - 420).forEach(function (k) { delete s.days[k]; });
    if (s.writes.length > 40) s.writes = s.writes.slice(-40);
    if (s.chat.length > 30) s.chat = s.chat.slice(-30);
    if (s.streak.frozen.length > 60) s.streak.frozen = s.streak.frozen.slice(-60);
  }

  // ---------- cloud sync (db capability) ----------
  N.store = { ref: null, status: 'local', lastSync: 0 };
  N.inSession = false;
  let pushTimer = null, pushing = false, dirty = false;

  N.save = function (immediate) {
    N.state.updatedAt = Date.now();
    prune();
    saveLocal();
    if (!N.store.ref) return;
    dirty = true;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(flush, immediate ? 0 : 700);
  };
  async function flush() {
    if (pushing || !dirty || !N.store.ref) return;
    pushing = true;
    dirty = false;
    let retry = false;
    try {
      await N.store.ref.set(JSON.parse(JSON.stringify(N.state)));
      N.store.status = 'cloud';
      N.store.lastSync = Date.now();
    } catch (e) {
      console.warn('sync failed', e);
      N.store.status = 'error';
      N.store.error = e && e.code;
      if (e && ['unavailable', 'resource_exhausted', 'network', 'gh_error'].indexOf(e.code) >= 0) { dirty = true; retry = true; }
    } finally {
      pushing = false;
      N.emit('sync');
      if (dirty) setTimeout(flush, retry ? 4000 + Math.random() * 3000 : 0);
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && dirty) { clearTimeout(pushTimer); flush(); }
  });

  let pendingRemote = null;
  function adopt(remote) {
    N.state = N.migrate(remote);
    saveLocal();
    N.emit('state:replaced');
  }
  N.applyPendingRemote = function () {
    if (pendingRemote && (pendingRemote.updatedAt || 0) > (N.state.updatedAt || 0)) adopt(pendingRemote);

  // Generic store: ref = { get() -> Promise<state|null>, set(state) -> Promise }. Used by the GitHub sync (sync.js).
  N.connectStore = async function (ref) {
    N.store.status = 'syncing';
    N.emit('sync');
    const remote = await ref.get();
    N.store.ref = ref;
    if (remote && (remote.updatedAt || 0) > (N.state.updatedAt || 0)) {
      adopt(remote);
      N.store.status = 'cloud';
      N.store.lastSync = Date.now();
    } else if (!remote || (N.state.updatedAt || 0) > (remote.updatedAt || 0)) {
      dirty = true;
      await flush();
    } else {
      N.store.status = 'cloud';
      N.store.lastSync = Date.now();
    }
    N.emit('sync');
  };
  N.pullStore = async function () {
    const ref = N.store.ref;
    if (!ref || pushing || dirty) return;
    try {
      const r = await ref.get();
      N.store.status = 'cloud';
      N.store.lastSync = Date.now();
      if (r && (r.updatedAt || 0) > (N.state.updatedAt || 0)) {
        if (N.inSession) pendingRemote = r; else adopt(r);
      }
    } catch (e) {
      N.store.status = 'error';
      N.store.error = e && e.code;
    }
    N.emit('sync');
  };
  N.disconnectStore = function () {
    N.store.ref = null;
    N.store.status = 'local';
    N.store.error = null;
    dirty = false;
    N.emit('sync');
  };

  N.initCloud = async function () {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const both = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const db = both[0], user = both[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc('data/users/' + id + '/state');
      N.store.status = 'syncing';
      N.emit('sync');
      const snap = await ref.get();
      const remote = snap.exists ? snap.data() : null;
      N.store.ref = ref;
      if (remote && (remote.updatedAt || 0) > (N.state.updatedAt || 0)) {
        adopt(remote);
        N.store.status = 'cloud';
      } else if (!remote || (N.state.updatedAt || 0) > (remote.updatedAt || 0)) {
        dirty = true;
        await flush();
      } else {
        N.store.status = 'cloud';
      }
      N.emit('sync');
      ref.onSnapshot(function (s) {
        if (!s.exists || s.metadata.hasPendingWrites) return;
        const r = s.data();
        if ((r.updatedAt || 0) <= (N.state.updatedAt || 0)) return;
        if (N.inSession) { pendingRemote = r; return; }
        adopt(r);
      }, function (e) { console.warn('sync listener ended', e); });
    } catch (e) {
      console.warn('cloud unavailable', e);
      N.store.status = 'local';
      N.emit('sync');
    }
  };

  // ---------- curriculum index ----------
  function validItem(it) {
    try {
      switch (it.type) {
        case 'learn': return !!(it.title || it.body);
        case 'mcq': return !!it.q && Array.isArray(it.options) && it.options.length >= 2 && Number.isInteger(it.answer) && it.answer >= 0 && it.answer < it.options.length;
        case 'tf': return !!it.q && typeof it.answer === 'boolean';
        case 'multi': return !!it.q && Array.isArray(it.options) && Array.isArray(it.answers) && it.answers.length > 0 && it.answers.every(function (a) { return Number.isInteger(a) && a >= 0 && a < it.options.length; });
        case 'order': return Array.isArray(it.items) && it.items.length >= 2;
        case 'match': return Array.isArray(it.pairs) && it.pairs.length >= 2 && it.pairs.every(function (p) { return Array.isArray(p) && p.length === 2; });
        case 'cloze': return typeof it.text === 'string' && Array.isArray(it.blanks) && it.blanks.length >= 1 && it.text.split('___').length - 1 === it.blanks.length;
        case 'compare': return !!it.a && !!it.b && (it.answer === 'a' || it.answer === 'b');
        case 'spot': return Array.isArray(it.parts) && it.parts.length >= 2 && Number.isInteger(it.answer) && it.answer >= 0 && it.answer < it.parts.length;
        case 'write': return !!it.task;
        default: return false;
      }
    } catch (e) { return false; }
  }
  N.QUIZ_TYPES = ['mcq', 'tf', 'multi', 'order', 'match', 'cloze', 'compare', 'spot'];

  N.buildIndex = function () {
    const units = (window.CURRICULUM || []).filter(function (u) { return u && u.id && Array.isArray(u.lessons); })

    N.units = units;
    N.unitById = {};
    N.lessonById = {};
    N.itemByKey = {};
    N.lessons = [];
    N.glossary = [];
    N.missions = [];
    units.forEach(function (u, ui) {
      u.index = ui;
      u.color = u.color || 'amber';
      u.guide = u.guide || [];
      u.tips = u.tips || [];
      N.unitById[u.id] = u;
      u.lessons = u.lessons.filter(function (l) { return l && l.id && Array.isArray(l.items); });
      u.lessons.forEach(function (l, li) {
        l.unit = u;
        l.index = li;
        N.lessonById[l.id] = l;

        l.items = l.items.map(function (it, i) {
          const c = Object.assign({}, it, { key: l.id + ':' + i, lessonId: l.id });
          return c;
        }).filter(function (it) {

          if (!ok) console.warn('Skipping invalid item', it.key, it);
          return ok;

        l.items.forEach(function (it) { N.itemByKey[it.key] = it; });
      });

      u.missions = (u.missions || []).filter(function (m) { return m && m.id && m.title; });
      u.missions.forEach(function (m) { m.unit = u; N.missions.push(m); });

  // ---------- progress ----------
  N.lessonDone = function (id) { const r = N.state.lessons[id]; return !!(r && r.n > 0); };

  N.unitLessonsDone = function (u) { return u.lessons.length > 0 && u.lessons.every(function (l) { return N.lessonDone(l.id); }); };

  };

      if (!N.unitDone(u)) return { type: 'test', unit: u };
    }

  };

    const s = N.nextStep();

  // ---------- XP, levels, streak ----------
  const TITLES = ['ניצוץ ראשון', 'סקרן', 'מתנסה', 'שואל שאלות טובות', 'מנסח', 'מנסח מיומן', 'בונה הקשר', 'אדריכל פרומפטים',

  };

  N.reconcileStreak = function () {
    const s = N.state.streak, t = N.today();

    }

  N.ensureQuests = function () {

    { id: 'tutor', t: 'שאלה טובה', d: 'שאלת את ניצי', icon: 'chat', test: function (s) { return s.stats.tutor >= 1; } }
  ];
  N.checkBadges = function () {
    const s = N.state, earned = [];
    N.BADGES.forEach(function (b) {
      if (s.badges[b.id]) return;
      let ok = false;
      try { ok = b.test(s); } catch (e) { ok = false; }
      if (ok) { s.badges[b.id] = Date.now(); earned.push(b); }
    });
    earned.forEach(function (b) { N.pendingToasts.push({ text: 'הישג חדש: ' + b.t, icon: 'medal' }); });
    return earned;
  };

  // ---------- spaced repetition ----------
  const INTERVALS = [0, 1, 2, 4, 8, 16, 32];
  N.srsRecord = function (key, ok, inReview) {
    if (!key) return;
    const t = N.dayNum(N.today());
    const it = N.state.items[key] || [0, t, 0, 0];
    if (ok) {
      it[0] = inReview ? Math.min(it[0] + 1, 6) : Math.max(it[0], 2);
      it[1] = t + INTERVALS[it[0]];
      it[3]++;
    } else {
      it[0] = 0;
      it[1] = inReview ? t + 1 : t;
      it[2]++;
    }
    N.state.items[key] = it;
  };
  N.dueItems = function () {
    const t = N.dayNum(N.today());
    return Object.keys(N.state.items)
      .filter(function (k) { return N.itemByKey[k] && N.state.items[k][1] <= t; })
      .sort(function (a, b) {
        const A = N.state.items[a], B = N.state.items[b];
        return A[0] - B[0] || B[2] - A[2];
      })
      .map(function (k) { return N.itemByKey[k]; });
  };
  N.seenQuizItems = function () {
    const out = [];
    N.doneLessons().forEach(function (l) {
      l.items.forEach(function (it) { if (N.QUIZ_TYPES.indexOf(it.type) >= 0) out.push(it); });
    });
    return out;
  };

  // ---------- sound & haptics ----------
  let actx = null;
  function ctx() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume().catch(function () {});
    return actx;
  }
  function tone(freq, start, dur, type, gain) {
    const a = ctx();
    if (!a) return;
    const t0 = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  const SFX = {
    tap: function () { tone(880, 0, 0.05, 'triangle', 0.05); },
    good: function () { tone(784, 0, 0.12, 'sine', 0.16); tone(1175, 0.09, 0.22, 'sine', 0.16); },
    bad: function () { tone(220, 0, 0.16, 'triangle', 0.14); tone(185, 0.12, 0.22, 'triangle', 0.12); },
    match: function () { tone(988, 0, 0.1, 'sine', 0.1); },
    done: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.1, 0.28, 'sine', 0.14); }); tone(1568, 0.42, 0.4, 'sine', 0.07); },
    gem: function () { tone(1568, 0, 0.1, 'sine', 0.08); tone(2093, 0.07, 0.18, 'sine', 0.08); },
    fail: function () { [392, 330, 262].forEach(function (f, i) { tone(f, i * 0.13, 0.25, 'triangle', 0.1); }); }
  };
  N.sfx = function (name) {
    if (!N.state.profile.sound) return;
    try { SFX[name] && SFX[name](); } catch (e) { /* audio unavailable */ }
  };
  N.buzz = function (ms) {
    try {
      if (!navigator.vibrate || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
      navigator.vibrate(ms);
    } catch (e) { /* no vibration */ }
  };

  // ---------- confetti ----------
  N.confetti = function (amount) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.getElementById('confetti');
    if (!cv) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr;
    cv.height = H * dpr;
    const g = cv.getContext('2d');
    g.scale(dpr, dpr);
    const colors = ['#FFB31F', '#FF7A59', '#8B5CF6', '#14B8A6', '#2F9BFF', '#F43F5E', '#74C11A'];
    const parts = [];
    const n = amount || 140;
    for (let i = 0; i < n; i++) {
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * W * 0.4, y: H * 0.35,
        vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 15 - 4,
        r: Math.random() * 6 + 4, a: Math.random() * Math.PI, va: (Math.random() - 0.5) * 0.3,
        c: colors[i % colors.length], shape: Math.random() < 0.5
      });
    }
    let frame = 0;
    function step() {
      frame++;
      g.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        g.save();
        g.translate(p.x, p.y);
        g.rotate(p.a);
        g.fillStyle = p.c;
        if (p.shape) g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        else { g.beginPath(); g.arc(0, 0, p.r / 2.4, 0, Math.PI * 2); g.fill(); }
        g.restore();
      });
      if (frame < 150) requestAnimationFrame(step);
      else g.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(step);
  };

  // ---------- toasts ----------
  N.toast = function (text, icon) {
    const box = document.getElementById('toasts');
    if (!box) return;
    const t = N.h('div', { class: 'toast' }, icon ? N.icon(icon, { size: 20, fill: icon === 'gem' || icon === 'flame' || icon === 'star' }) : null, N.h('span', null, text));
    box.append(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 300); }, 3200);
  };
  N.flushToasts = function () {
    const list = N.pendingToasts.splice(0);
    list.forEach(function (t, i) { setTimeout(function () { N.toast(t.text, t.icon); if (t.icon === 'gem') N.sfx('gem'); }, i * 650); });
  };

  // ---------- modal ----------
  N.modal = function (opts) {
    const host = document.getElementById('modal');
    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      back.remove();
      document.removeEventListener('keydown', onKey, true);
      if (opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); close(); } }
    const actions = (opts.actions || []).map(function (a) {
      return N.h('button', {
        class: 'btn ' + (a.kind || 'btn-ghost') + ' btn-block', type: 'button',
        onclick: function () { if (a.onClick) { const r = a.onClick(); if (r === false) return; } close(); }
      }, a.icon ? N.icon(a.icon) : null, a.label);
    });
    const sheet = N.h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '' },
      N.h('div', { class: 'sheet-h' },
        N.h('div', { class: 'grow stack', style: { gap: '4px' } },
          opts.eyebrow ? N.h('span', { class: 'eyebrow' }, opts.eyebrow) : null,
          opts.title ? N.h('h2', null, opts.title) : null),
        opts.noClose ? null : N.h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'סגור', onclick: close }, N.icon('x'))),
      opts.body || null,
      actions.length ? N.h('div', { class: 'sheet-actions' }, actions) : null);
    const back = N.h('div', { class: 'modal-back', onclick: function (e) { if (e.target === back && !opts.noClose) close(); } }, sheet);
    host.append(back);
    document.addEventListener('keydown', onKey, true);
    const f = sheet.querySelector(opts.focus || '.btn, textarea, input');
    if (f) setTimeout(function () { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);
    return { close: close, sheet: sheet };
  };

  N.copyText = function (text, btn) {
    function done() { N.toast('הועתק', 'copy'); }
    try {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } catch (e) { fallback(); }
    function fallback() {
      const ta = N.h('textarea', { style: { position: 'fixed', opacity: '0' } });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      ta.remove();
      if (btn) btn.focus();
    }
  };
})();

<script>
(function () {
  'use strict';
  const N = window.N;
  // Two ways to reach Claude:
  //  - 'claude': inside a claude.ai artifact, through the viewer's own account (the `sample` capability)
  //  - 'api':    the standalone app, with the learner's own API key (direct call to the Claude API)
  const ai = N.ai = { fn: null, off: false, mode: 'off' };
  N.hosted = !!(window.claude && typeof window.claude.use === 'function');

  const KEY_LS = 'nitzutz.apikey', MODEL_LS = 'nitzutz.model';
  ai.MODELS = [
    { id: 'claude-opus-5-5', name: 'Opus 5.5', note: 'הכי חכם. בערך 2-5 סנט לבדיקה', fallbacks: true },
    { id: 'claude-sonnet-5-5', name: 'Sonnet 5.5', note: 'מאוזן. בערך 1-3 סנט לבדיקה', fallbacks: true },
    { id: 'claude-haiku-5-5', name: 'Haiku 5.5', note: 'הכי מהיר וזול. פחות מסנט לבדיקה', fallbacks: false }
  ];
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  ai.apiKey = function () { return lsGet(KEY_LS); };
  ai.model = function () {
    const m = lsGet(MODEL_LS);
    return ai.MODELS.some(function (x) { return x.id === m; }) ? m : ai.MODELS[0].id;
  };
  ai.setModel = function (id) { lsSet(MODEL_LS, id); };
  ai.setApiKey = function (k) { lsSet(KEY_LS, (k || '').trim()); ai.configure(); };

  function parseJSON(text) {
    const t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) { /* try the fallbacks below */ }
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (fence) { try { return JSON.parse(fence[1]); } catch (e) { /* keep trying */ } }
    const a = t.search(/[[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* give up */ } }
    throw { code: 'invalid_json', text: t };
  }

  // Same calling shape as the artifact `sample` function: fn(input, opts) -> {text}, fn.json(input, opts) -> value
  function apiFn(key) {
    async function call(input, opts) {
      opts = opts || {};
      const turns = typeof input === 'string' ? [{ role: 'user', content: input }] : input;
      const messages = [];
      turns.forEach(function (m) {
        const last = messages[messages.length - 1];
        if (last && last.role === m.role) last.content += '\n\n' + m.content;
        else messages.push({ role: m.role, content: m.content });
      });
      const model = ai.model();
      const def = ai.MODELS.find(function (x) { return x.id === model; }) || ai.MODELS[0];
      const body = { model: model, max_tokens: 16000, messages: messages };
      const headers = {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      };
      if (def.fallbacks) { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
      if (opts.modelTier === 'quick') body.output_config = { effort: 'low' };
      let res;
      try {
        res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: headers, body: JSON.stringify(body), signal: opts.signal });
      } catch (e) {
        if (e && e.name === 'AbortError') throw { code: 'cancelled' };
        throw { code: 'network' };
      }
      if (!res.ok) {
        let msg = '';
        try { const j = await res.json(); msg = j && j.error && j.error.message || ''; } catch (e) { /* no body */ }
        const code = res.status === 401 || res.status === 403 ? 'bad_key' : res.status === 429 ? 'rate_limited' : res.status === 400 ? 'invalid_request' : 'upstream_error';
        throw { code: code, message: msg, status: res.status };
      }
      const j = await res.json();
      if (j.stop_reason === 'refusal') throw { code: 'refused' };
      const text = (j.content || []).filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('');
      if (!text.trim()) throw { code: 'empty_completion' };
      if (opts.onText) { try { opts.onText({ text: text, delta: text }); } catch (e) { console.error(e); } }
      return { text: text, truncated: j.stop_reason === 'max_tokens' };
    }
    const fn = function (input, opts) { return call(input, opts); };
    fn.json = function (input, opts) { return call(input, opts).then(function (r) { return parseJSON(r.text); }); };
    return fn;
  }

  ai.configure = function () {
    if (N.hosted) return;
    const key = ai.apiKey();
    ai.fn = key ? apiFn(key) : null;
    ai.mode = key ? 'api' : 'off';
    ai.off = false;
    N.emit('ai');
  };

  ai.ready = (async function () {
    if (!N.hosted) { ai.configure(); return ai.fn; }
    try {
      ai.fn = (await window.claude.use('sample')) || null;
      ai.mode = ai.fn ? 'claude' : 'off';
    } catch (e) {
      ai.fn = null;
    }
    N.emit('ai');
    return ai.fn;
  })();

  ai.available = function () { return !!ai.fn && !ai.off; };

  // A tiny request to check that the key and model work.
  ai.test = function () { return ai.fn('ענה במילה אחת בלבד: מחובר', { modelTier: 'quick' }); };

  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  ai.errorText = function (e) {
    const code = e && e.code;
    if (PERMANENT.indexOf(code) >= 0) {

      N.emit('ai');
      return 'קלוד לא זמין כאן כרגע, אז נמשיך בלעדיו.';
    }
    switch (code) {
      case 'bad_key': return 'מפתח ה־API לא התקבל. בדוק אותו בפרופיל, תחת ״קלוד בתוך האפליקציה״.';
      case 'network': return 'אין חיבור לשרת של קלוד. בדוק את החיבור לאינטרנט.';
      case 'invalid_request': return 'הבקשה לקלוד נדחתה' + (e.message ? ': ' + e.message : '.');
      case 'cancelled': return '';
      case 'rate_limited': return 'יותר מדי בקשות כרגע. נסה שוב בעוד דקה.';
      case 'session_expired': return 'צריך להתחבר מחדש לקלוד, ואז לנסות שוב.';
      case 'refused': return 'קלוד לא ענה על הבקשה הזו. נסה לנסח אחרת.';
      case 'invalid_json': return 'התשובה של קלוד הגיעה במבנה לא צפוי. נסה שוב.';
      case 'prompt_too_large': return 'הטקסט ארוך מדי. נסה לקצר.';
      case 'empty_completion': return 'קלוד לא החזיר תשובה. נסה לנסח אחרת.';
      default: return 'החיבור לקלוד נכשל. נסה שוב.';
    }
  };

  const VOICE = 'כתוב בעברית טבעית וברורה, בפנייה ללומד בלשון זכר יחיד. אל תשתמש בכותרות.';

  function learnerContext() {
    const done = N.doneLessons().map(function (l) { return l.title; });
    const cur = N.currentUnit();
    return 'שיעורים שהלומד כבר השלים: ' + (done.length ? done.join(', ') : 'עדיין אין') + '.\n' +
      'היחידה הנוכחית שלו: ' + (cur ? cur.title : 'לא ידוע') + '.';
  }

  // Grade a free-writing answer against its rubric. Resolves a normalized result.
  ai.grade = async function (item, answer, signal) {
    const rubric = (item.rubric || []).map(function (r, i) { return (i + 1) + '. ' + r; }).join('\n');
    const prompt =
      'אתה מורה מנוסה, קפדן אבל מעודד, שמלמד אנשי מקצוע לכתוב פרומפטים טובים לקלוד ולעבוד נכון עם בינה מלאכותית.\n' +
      'הלומד קיבל משימת כתיבה באפליקציית לימוד. הערך את התשובה שלו לפי הקריטריונים.\n\n' +
      '<task>\n' + item.task + '\n</task>\n\n' +
      '<rubric>\n' + rubric + '\n</rubric>\n\n' +
      (item.sample ? '<reference_answer>\n' + item.sample + '\n</reference_answer>\n(תשובת ייחוס לעיונך בלבד. אל תדרוש התאמה מילולית, יש הרבה דרכים טובות.)\n\n' : '') +

      '{"score": מספר שלם 0-100, "criteria": [{"ok": true או false, "note": "משפט קצר על הקריטריון"}], "strengths": ["נקודה חזקה"], "improve": ["שיפור ספציפי"], "improved": "גרסה משופרת של התשובה של הלומד, שומרת על הכוונה שלו", "summary": "משפט אחד מסכם ומעודד"}\n' +
      'כללים: פריט אחד ב־criteria לכל קריטריון, באותו סדר. 1-3 נקודות חזקות ו־1-3 שיפורים, כל אחד משפט קצר וקונקרטי. ' +
      'ציון 90 ומעלה רק לתשובה שעומדת בכל הקריטריונים היטב. תשובה ריקה או לא קשורה מקבלת ציון נמוך. ' +

      mode: 'ai',
      score: N.clamp(Math.round(Number(r && r.score) || 0), 0, 100),
      criteria: Array.from({ length: n }, function (_, i) {

      }),

      improve: (Array.isArray(r && r.improve) ? r.improve : []).map(String).slice(0, 4),

  // Deeper explanation of an exercise the learner just answered (streams).
  ai.explain = function (ctx, onText, signal) {
    const prompt =
      'אתה מורה סבלני באפליקציה שמלמדת עבודה עם קלוד ובינה מלאכותית. הלומד ענה עכשיו על תרגיל וביקש הסבר מעמיק יותר.\n\n' +
      '<exercise>\n' + ctx.exercise + '\n</exercise>\n' +
      '<correct_answer>\n' + (ctx.correct || '') + '\n</correct_answer>\n' +
      '<learner_answer>\n' + (ctx.given || '') + '\n</learner_answer>\n' +
      '<shown_explanation>\n' + (ctx.explain || '') + '\n</shown_explanation>\n' +
      'הלומד ענה ' + (ctx.ok ? 'נכון' : 'לא נכון') + '.\n\n' +
      'הסבר את הרעיון לעומק ב־3 עד 5 משפטים, בלי לחזור על ההסבר שכבר הוצג. ' +
      (ctx.ok ? '' : 'אם אפשר, הסבר למה התשובה שבחר מפתה אבל לא נכונה. ') +
      'תן דוגמה מעשית אחת קצרה, רצוי מעולם העבודה המשרדית או הפיננסית. ' + VOICE;
    return ai.fn(prompt, { modelTier: 'quick', onText: onText, signal: signal });
  };

  // Tutor chat: turns = [{role, content}], oldest first, ending on a user turn.
  ai.tutor = function (turns, onText, signal) {
    const rules =
      'אתה "ניצי", מורה פרטי חם, חד וחכם באפליקציית "ניצוץ", שמלמדת איש מקצוע מתחום הפיננסים לעבוד עם קלוד ולבנות בעזרת בינה מלאכותית.\n' +
      learnerContext() + '\n' +
      'ענה בעברית, בלשון זכר יחיד, בתשובות ממוקדות (עד 160 מילים, אלא אם ביקש יותר). אפשר להשתמש ברשימות קצרות. ' +
      'השתמש בדוגמאות מעשיות מעבודה משרדית ופיננסית כשזה מתאים. ' +
      'אם אתה לא בטוח בפרט מוצר ספציפי (שם תפריט, מחיר, מגבלה), אמור זאת במפורש במקום לנחש. ' +
      'לפעמים, לא תמיד, סיים בשאלה קצרה שבודקת הבנה או בהצעה לתרגול קטן.';
    const input = [{ role: 'user', content: rules }].concat(turns);
    return ai.fn(input, { cache: false, onText: onText, signal: signal });
  };

  // A fresh daily writing challenge based on the learner's current unit.
  ai.daily = async function (unit, dayKey) {
    const topics = unit.lessons.map(function (l) { return l.title + ' (' + (l.goal || '') + ')'; }).join('; ');
    const prompt =
      'צור אתגר כתיבה יומי אחד ללומד באפליקציה שמלמדת עבודה עם קלוד. הלומד הוא איש מקצוע בתחום האשראי והפיננסים.\n' +
      'תאריך: ' + dayKey + '.\n' +
      'נושאי היחידה הנוכחית: ' + unit.title + ' — ' + topics + '\n' +
      learnerContext() + '\n\n' +
      'האתגר: תרחיש מציאותי וקונקרטי (עבודה או חיים, לסירוגין) שבו הלומד צריך לכתוב פרומפט לקלוד, או לתכנן איך ישתמש בקלוד, תוך יישום הנושאים. ' +
      'החזר אובייקט JSON אחד בלבד:\n' +
      '{"title": "כותרת של 2-5 מילים", "task": "התרחיש ומה בדיוק לכתוב, 2-4 משפטים", "rubric": ["3-5 קריטריונים קצרים שאפשר לבדוק"], "sample": "תשובה מצוינת לדוגמה, עם \\n בין שורות"}\n' + VOICE;
    const r = await ai.fn.json(prompt, { cache: { gcTime: 86400000 } });
    if (!r || !r.task || !Array.isArray(r.rubric) || !r.rubric.length) throw { code: 'invalid_json' };
    return { title: String(r.title || 'אתגר היום'), task: String(r.task), rubric: r.rubric.map(String).slice(0, 5), sample: String(r.sample || '') };
  };

  // Short feedback on a field-mission reflection (streams).
  ai.missionFeedback = function (mission, reflection, onText, signal) {
    const prompt =
      'אתה מורה באפליקציה שמלמדת עבודה עם קלוד. הלומד ביצע משימת שטח אמיתית בקלוד וכתב רפלקציה.\n' +
      '<mission>\n' + mission.title + '\n' + (mission.steps || []).join('\n') + '\n</mission>\n' +
      '<question>\n' + (mission.reflect || '') + '\n</question>\n' +
      '<reflection>\n' + reflection + '\n</reflection>\n\n' +
      'תן משוב קצר (עד 120 מילים): מה הוא עשה טוב, תובנה אחת שכדאי לקחת הלאה, ורעיון אחד לניסוי הבא. ' + VOICE;
    return ai.fn(prompt, { onText: onText, signal: signal, cache: false });
  };
})();

<script>
(function () {
  'use strict';
  // Sync between devices for the standalone app: progress lives in one private GitHub Gist.
  // The learner pastes a GitHub token (gist permission only) once; other devices connect by scanning a QR code.
  const N = window.N, h = N.h;
  const FILE = 'nitzutz-progress.json';
  const TOKEN_LS = 'nitzutz.gh.token', GIST_LS = 'nitzutz.gh.gist', KEY_LS = 'nitzutz.apikey';
  const sync = N.sync = {};

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }

  async function gh(token, path, opts) {
    opts = opts || {};
    const headers = { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token };
    if (opts.body) headers['Content-Type'] = 'application/json';
    let res;
    try {
      res = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers: headers, body: opts.body, cache: 'no-store' });
    } catch (e) {
      throw { code: 'network' };
    }
    if (!res.ok) {
      const code = res.status === 401 ? 'bad_token' : (res.status === 403 || res.status === 404) ? 'no_access' : 'gh_error';
      throw { code: code, status: res.status };
    }
    return res.status === 204 ? null : res.json();
  }

  async function findOrCreate(token) {
    for (let page = 1; page <= 5; page++) {
      const list = await gh(token, '/gists?per_page=100&page=' + page);
      const hit = list.find(function (g) { return g.files && g.files[FILE]; });
      if (hit) return hit.id;
      if (list.length < 100) break;
    }
    const files = {};
    files[FILE] = { content: JSON.stringify(N.state) };
    const created = await gh(token, '/gists', { method: 'POST', body: JSON.stringify({ description: 'Nitzutz progress (private)', public: false, files: files }) });
    return created.id;
  }

  function gistRef(token, id) {
    return {
      get: async function () {
        const g = await gh(token, '/gists/' + id);
        const f = g.files && g.files[FILE];
        if (!f) return null;
        let text = f.content;
        if (f.truncated && f.raw_url) {
          try { text = await (await fetch(f.raw_url, { cache: 'no-store' })).text(); } catch (e) { throw { code: 'network' }; }
        }
        try { return JSON.parse(text); } catch (e) { return null; }
      },
      set: function (data) {
        const files = {};
        files[FILE] = { content: JSON.stringify(data) };
        return gh(token, '/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: files }) });
      }
    };
  }

  sync.connected = function () { return !!(lsGet(TOKEN_LS) && lsGet(GIST_LS)); };

  sync.errorText = function (e) {
    switch (e && e.code) {
      case 'bad_token': return 'ה־token לא התקבל. ייתכן שפג תוקפו או שהועתק לא שלם.';
      case 'no_access': return 'ל־token אין הרשאה ל־Gists. צור token עם הרשאת Gists לקריאה וכתיבה.';
      case 'network': return 'אין חיבור ל־GitHub. בדוק את החיבור לאינטרנט.';
      default: return 'הסנכרון עם GitHub נכשל. נסה שוב.';
    }
  };

  // Connect with a token (first device) or with token + gist id (from the QR code).
  sync.connect = async function (token, gistId) {
    token = String(token || '').trim();
    if (!token) throw { code: 'bad_token' };
    const id = gistId || await findOrCreate(token);
    lsSet(TOKEN_LS, token);
    lsSet(GIST_LS, id);
    await N.connectStore(gistRef(token, id));
  };

  sync.disconnect = function () {
    lsSet(TOKEN_LS, '');
    lsSet(GIST_LS, '');
    N.disconnectStore();
  };

  // A link that connects another device: everything after # stays on the device and is never sent to a server.
  sync.pairLink = function (withKey) {
    const parts = [lsGet(TOKEN_LS), lsGet(GIST_LS)];
    if (withKey && lsGet(KEY_LS)) parts.push(lsGet(KEY_LS));
    const base = location.href.split('#')[0];
    return base + '#sync=' + encodeURIComponent(btoa(parts.join('|')));
  };

  // Accepts a full pairing link (…#sync=…) and returns {token, gist, key}, or null.
  sync.parsePairing = function (text) {
    const m = String(text || '').trim().match(/#sync=([^\s]+)/);
    if (!m) return null;
    try {
      const parts = atob(decodeURIComponent(m[1])).split('|');
      if (parts.length >= 2 && parts[0] && parts[1]) return { token: parts[0], gist: parts[1], key: parts[2] || '' };
    } catch (e) { /* malformed link */ }
    return null;
  };
  function readPairing() {
    if (!/^#sync=/.test(location.hash)) return null;
    const pair = sync.parsePairing(location.hash);
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { /* ignore */ }
    return pair;
  }
  sync.pair = async function (pair) {
    if (pair.key) N.ai.setApiKey(pair.key);
    await sync.connect(pair.token, pair.gist);
    if (!N.state.profile.onboarded) { N.state.profile.onboarded = true; N.save(true); }
  };

  sync.init = async function () {
    if (N.hosted) return;
    const pair = readPairing();
    if (pair) {
      try {
        await sync.pair(pair);
        N.toast('המכשיר חובר לסנכרון', 'cloud');
        N.render();
      } catch (e) {
        N.toast(sync.errorText(e), 'info');
      }
      return;
    }
    if (sync.connected()) {
      try { await N.connectStore(gistRef(lsGet(TOKEN_LS), lsGet(GIST_LS))); }
      catch (e) { N.store.status = 'error'; N.store.error = e && e.code; N.emit('sync'); }
    }
  };

  // Pick up progress made on the other device when the app comes back to the foreground.
  function maybePull() { if (document.visibilityState === 'visible' && N.store.ref && !N.hosted) N.pullStore(); }
  document.addEventListener('visibilitychange', maybePull);
  window.addEventListener('focus', maybePull);
  setInterval(maybePull, 90000);

  // ---------- QR code (library loaded on demand) ----------
  let qrLib = null;
  function loadQr() {
    if (window.qrcode) return Promise.resolve(window.qrcode);
    if (qrLib) return qrLib;
    qrLib = new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.onload = function () { window.qrcode ? resolve(window.qrcode) : reject(new Error('qr')); };
      s.onerror = function () { qrLib = null; reject(new Error('qr')); };
      document.head.append(s);
    });
    return qrLib;
  }

  function showPairing() {
    const hasKey = !!lsGet(KEY_LS);
    const withKey = h('input', { type: 'checkbox', id: 'pair-key', checked: hasKey });
    const qrBox = h('div', { style: { display: 'grid', placeItems: 'center', minHeight: '220px', background: '#fff', borderRadius: '16px', padding: '12px' } }, h('span', { class: 'dots' }, h('span'), h('span'), h('span')));
    const copyBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, N.icon('copy', { size: 16 }), 'העתק קישור חיבור');
    function draw() {
      const link = sync.pairLink(withKey.checked);
      loadQr().then(function (qrcode) {
        const qr = qrcode(0, 'L');
        qr.addData(link);
        qr.make();
        N.clear(qrBox).append(h('img', { src: qr.createDataURL(5, 2), alt: 'קוד QR לחיבור הטלפון', style: { width: '220px', maxWidth: '100%', imageRendering: 'pixelated' } }));
      }).catch(function () {
        N.clear(qrBox).append(h('p', { class: 'muted small', style: { color: '#565C80' } }, 'לא הצלחתי לטעון את קוד ה־QR. אפשר להעתיק את הקישור ולפתוח אותו בטלפון.'));
      });
    }
    withKey.addEventListener('change', draw);
    copyBtn.addEventListener('click', function () { N.copyText(sync.pairLink(withKey.checked), copyBtn); });
    const local = location.protocol === 'file:';
    N.modal({
      eyebrow: 'סנכרון', title: 'חיבור הטלפון',
      body: h('div', { class: 'stack', style: { gap: '14px' } },
        local
          ? h('div', { class: 'note' }, N.icon('info', { size: 20 }), h('span', null, 'האפליקציה פתוחה מקובץ במחשב, אז הקישור לא יעבוד בטלפון. פתח אותה מהכתובת שלה ב־GitHub Pages ונסה שוב.'))
          : h('p', { class: 'muted' }, 'סרוק את הקוד במצלמה של הטלפון. הטלפון יתחבר לאותה התקדמות.'),
        qrBox,
        hasKey ? h('label', { class: 'row', for: 'pair-key', style: { flexWrap: 'nowrap', cursor: 'pointer' } }, withKey, h('span', null, 'לחבר גם את קלוד (מפתח ה־API)')) : null,
        h('div', { class: 'note' }, N.icon('shield', { size: 20 }), h('span', null, 'הקוד מכיל את הגישה לסנכרון שלך. אל תצלם ואל תשלח אותו לאחרים.')),
        copyBtn)
    });
    draw();
  }

  // ---------- profile card ----------
  N.syncCard = function () {
    if (N.hosted) return null;
    const on = sync.connected();
    const out = h('p', { class: 'muted small', 'aria-live': 'polite' });
    const card = h('div', { class: 'card', id: 'sync-card' });
    const head = h('div', { class: 'card-h' }, h('h3', null, 'סנכרון בין מכשירים'), N.icon('cloud', { size: 22, cls: 'muted' }));
    if (on) {
      const st = N.store.status;
      const when = N.store.lastSync ? new Date(N.store.lastSync).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '';
      const line = st === 'error' ? sync.errorText({ code: N.store.error }) : st === 'syncing' ? 'מסנכרן…' : 'מסונכרן' + (when ? ' · עודכן ב־' + when : '');
      card.append(head,
        h('div', { class: 'sync ' + (st === 'error' ? 'error' : 'cloud') }, h('span', { class: 'dot' }), h('span', null, line)),
        h('p', { class: 'muted' }, 'ההתקדמות נשמרת בקובץ פרטי בחשבון ה־GitHub שלך, וכל מכשיר מחובר רואה אותה.'),
        h('div', { class: 'row' },
          h('button', { class: 'btn btn-primary btn-sm', type: 'button', onclick: showPairing }, N.icon('send', { size: 16 }), 'חבר את הטלפון'),
          h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: function () { N.pullStore().then(function () { N.render(); }); } }, N.icon('refresh', { size: 16 }), 'סנכרן עכשיו'),
          h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: function () { sync.disconnect(); N.render(); } }, 'נתק מכשיר זה')),
        out);
      return card;
    }
    const input = h('input', { class: 'search', id: 'gh-token', type: 'password', autocomplete: 'off', spellcheck: 'false', dir: 'ltr', placeholder: 'github_pat_…', 'aria-label': 'GitHub token או קישור חיבור' });
    const go = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'חבר');
    go.addEventListener('click', function () {
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      go.disabled = true;
      out.textContent = 'מתחבר ל־GitHub…';
      const pair = sync.parsePairing(v);
      (pair ? sync.pair(pair) : sync.connect(v)).then(function () {
        N.toast('הסנכרון פעיל', 'cloud');
        N.render();
        setTimeout(function () { const el = document.getElementById('sync-card'); if (el) el.scrollIntoView({ block: 'center' }); }, 60);
      }).catch(function (e) { out.textContent = sync.errorText(e); go.disabled = false; });
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
    card.append(head,
      h('p', { class: 'muted' }, 'רוצה לראות את אותה התקדמות במחשב ובטלפון? מחברים פעם אחת את חשבון ה־GitHub שלך, וההתקדמות נשמרת שם בקובץ פרטי. במכשיר נוסף אפשר להדביק כאן גם קישור חיבור.'),
      h('div', { class: 'row', style: { flexWrap: 'nowrap' } }, h('div', { class: 'grow' }, input), go),
      out,
      h('details', { class: 'more' }, h('summary', null, 'איך יוצרים token'),
        h('ol', { class: 'stack', style: { gap: '6px', marginTop: '6px' } },
          h('li', null, 'ב־GitHub נכנסים ל־', N.ltr('Settings → Developer settings → Personal access tokens → Fine-grained tokens'), '.'),
          h('li', null, 'יוצרים token חדש. תחת ', N.ltr('Account permissions'), ' נותנים ל־', N.ltr('Gists'), ' הרשאת ', N.ltr('Read and write'), ', ולא שום הרשאה אחרת.'),
          h('li', null, 'מעתיקים את ה־token ומדביקים כאן. הוא נשמר רק בדפדפן הזה.'))));
    return card;
  };
})();

<script>
(function () {
  'use strict';
  const N = window.N, h = N.h;
  const E = N.EX = {};

  const KIND = {
    mcq: ['בחר את התשובה הנכונה', 'target'],
    tf: ['נכון או לא נכון?', 'check'],
    multi: ['סמן את כל התשובות הנכונות', 'list'],
    order: ['סדר לפי הסדר הנכון', 'list'],
    match: ['התאם בין הזוגות', 'layers'],
    cloze: ['השלם את החסר', 'pen'],
    compare: ['מה עדיף?', 'sparkle'],
    spot: ['מצא את החלק הבעייתי', 'search'],
    write: ['אתגר כתיבה', 'pen']
  };
  function kind(type, label) {
    const k = KIND[type];
    return h('div', { class: 'ex-kind' }, N.icon(k[1], { size: 18 }), label || k[0]);
  }
  N.plain = function (t) { return String(t == null ? '' : t).replace(/\*\*|`/g, ''); };
  const plain = N.plain;
  function norm(t) { return plain(t).trim().replace(/\s+/g, ' '); }
  function numKey(e, max) {
    const n = parseInt(e.key, 10);
    return n >= 1 && n <= max ? n - 1 : -1;
  }

  // ---------- learn ----------
  E.learn = function (it, api) {
    api.ready(true);
    const el = h('div', { class: 'ex' },
      h('article', { class: 'learn' },
        h('div', { class: 'learn-h' },
          N.mascot('idle', { anim: 'bob' }),
          h('div', { class: 'stack', style: { gap: '2px' } },
            h('span', { class: 'eyebrow' }, 'רעיון חדש'),
            h('h2', null, N.inline(it.title || '')))),
        it.body ? N.rich(it.body) : null,
        it.example && it.example.text ? N.promptBlock(it.example.text, it.example.label || 'דוגמה') : null,
        it.note ? h('div', { class: 'note' }, N.icon('bulb', { size: 20 }), N.rich(it.note)) : null));
    return { el: el, learn: true };
  };

  // ---------- multiple choice ----------
  E.mcq = function (it, api) {
    const order = N.shuffle(it.options.map(function (_, i) { return i; }));
    let sel = null, locked = false;
    const btns = order.map(function (oi, pos) {
      return h('button', { class: 'opt', type: 'button', onclick: function () { pick(pos); } },
        h('span', { class: 'opt-k' }, String(pos + 1)),
        h('span', { class: 'opt-t' }, N.inline(it.options[oi])));
    });
    function pick(pos) {
      if (locked) return;
      sel = pos;
      btns.forEach(function (b, i) { b.classList.toggle('sel', i === pos); });
      N.sfx('tap');
      api.ready(true);
    }
    const el = h('div', { class: 'ex' }, kind('mcq'), h('div', { class: 'ex-q' }, N.rich(it.q)), h('div', { class: 'opts' }, btns));
    return {
      el: el,
      key: function (e) { const k = numKey(e, btns.length); if (k >= 0) { pick(k); return true; } return false; },
      check: function () {
        locked = true;
        const ok = order[sel] === it.answer;
        btns.forEach(function (b, i) {
          b.disabled = true;
          b.classList.remove('sel');
          if (order[i] === it.answer) b.classList.add('right');
          else if (i === sel) b.classList.add('wrong');
        });
        return { ok: ok, correct: plain(it.options[it.answer]), given: plain(it.options[order[sel]]) };
      }
    };
  };

  // ---------- true / false ----------
  E.tf = function (it, api) {
    let sel = null, locked = false;
    const vals = [true, false];
    const btns = vals.map(function (v, i) {
      return h('button', { class: 'opt', type: 'button', onclick: function () { pick(i); } },
        N.icon(v ? 'check' : 'x', { size: 22 }), v ? 'נכון' : 'לא נכון');
    });
    function pick(i) {
      if (locked) return;
      sel = i;
      btns.forEach(function (b, j) { b.classList.toggle('sel', j === i); });
      N.sfx('tap');
      api.ready(true);
    }
    const el = h('div', { class: 'ex' }, kind('tf'), h('div', { class: 'statement' }, N.rich(it.q)), h('div', { class: 'tf' }, btns));
    return {
      el: el,
      key: function (e) { const k = numKey(e, 2); if (k >= 0) { pick(k); return true; } return false; },
      check: function () {
        locked = true;
        const ok = vals[sel] === it.answer;
        btns.forEach(function (b, i) {
          b.disabled = true;
          b.classList.remove('sel');
          if (vals[i] === it.answer) b.classList.add('right');
          else if (i === sel) b.classList.add('wrong');
        });
        return { ok: ok, correct: it.answer ? 'נכון' : 'לא נכון', given: vals[sel] ? 'נכון' : 'לא נכון' };
      }
    };
  };

  // ---------- select all that apply ----------
  E.multi = function (it, api) {
    const order = N.shuffle(it.options.map(function (_, i) { return i; }));
    const chosen = new Set();
    let locked = false;

    return {
      el: el,
      key: function (e) { const k = numKey(e, btns.length); if (k >= 0) { toggle(k); return true; } return false; },
      check: function () {
        locked = true;
        const right = new Set(it.answers);
        let ok = true;
        btns.forEach(function (b, pos) {
          b.disabled = true;
          const isRight = right.has(order[pos]), picked = chosen.has(pos);

          ok: ok,
          correct: it.answers.map(function (i) { return plain(it.options[i]); }).join(' | '),

  // ---------- ordering ----------

  E.match = function (it, api) {

  };

  // ---------- which is better ----------
